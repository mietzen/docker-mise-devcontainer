name: Build Docker Image

on:
  pull_request:
  release:
    types: [published]

jobs:
  Setup:
    runs-on: ubuntu-latest
    outputs:
      repo_name_lower_case: ${{ steps.set-matrix.outputs.repo_name_lower_case }}
    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        fetch-depth: 0
    - name: Setup Image Name
      id: set-matrix
      run: |
        echo "repo_name_lower_case=$(echo ${GITHUB_REPOSITORY@L} | cut -d'/' -f2)" >> $GITHUB_OUTPUT

  Build:
    runs-on: ubuntu-latest
    needs: Setup
    env:
      IMAGE_NAME: ${{ vars.IMAGE_NAME || needs.Setup.outputs.repo_name_lower_case }}
      PUSH: ${{ github.event_name == 'release' && '--push' || '' }}
    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Load version files
      id: versions
      run: |
        echo "version=$(cat VERSION)" >> $GITHUB_OUTPUT
        echo "mise=$(cat MISE_VERSION)" >> $GITHUB_OUTPUT
        echo "uv=$(cat UV_VERSION)" >> $GITHUB_OUTPUT

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Login to Docker Hub
      if: github.event_name == 'release'
      uses: docker/login-action@v4
      with:
        username: ${{ vars.DOCKER_HUB_USERNAME || github.repository_owner }}
        password: ${{ secrets.DOCKER_HUB_DEPLOY_KEY }}

    - name: Build and push multi-arch image
      env:
        DOCKER_USER: ${{ vars.DOCKER_HUB_USERNAME || github.repository_owner }}
        IMAGE_NAME: ${{ vars.IMAGE_NAME || github.event.repository.name }}
        VERSION: ${{ steps.versions.outputs.version }}
        MISE_VERSION: ${{ steps.versions.outputs.mise }}
        UV_VERSION: ${{ steps.versions.outputs.uv }}
      run: |
        PLATFORMS=$(cat .github/platforms.json | jq -r '.platforms | join(",")')
        echo "============================================================="
        echo "Building: ${DOCKER_USER}/${IMAGE_NAME}:${VERSION}"
        echo "          ${DOCKER_USER}/${IMAGE_NAME}:${VERSION}-mise-${MISE_VERSION}-uv-${UV_VERSION}"
        echo "          ${DOCKER_USER}/${IMAGE_NAME}:latest"
        echo "          platforms: ${PLATFORMS}  push: ${PUSH}"
        echo "============================================================="
        docker buildx build \
          --platform "${PLATFORMS}" ${PUSH} \
          --tag "${DOCKER_USER}/${IMAGE_NAME}:${VERSION}" \
          --tag "${DOCKER_USER}/${IMAGE_NAME}:${VERSION}-mise-${MISE_VERSION}-uv-${UV_VERSION}" \
          --tag "${DOCKER_USER}/${IMAGE_NAME}:latest" \
          --build-arg MISE_VERSION="${MISE_VERSION}" \
          --build-arg UV_VERSION="${UV_VERSION}" \
          -f Dockerfile .