name: Build Docker Image

on:
  pull_request:
  release:
    types: [published]

jobs:
  Setup:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.versions.outputs.version }}
      mise: ${{ steps.versions.outputs.mise }}
      uv: ${{ steps.versions.outputs.uv }}
      repo_name_lower_case: ${{ steps.compute.outputs.repo_name_lower_case }}
      build_matrix: ${{ steps.compute.outputs.build_matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Load versions
        id: versions
        run: |
          TAG="${{ github.event.release.tag_name || 'main' }}"
          echo "version=${TAG#v}" >> $GITHUB_OUTPUT
          echo "mise=$(cat MISE_VERSION)" >> $GITHUB_OUTPUT
          echo "uv=$(cat UV_VERSION)" >> $GITHUB_OUTPUT
      - name: Compute matrix + image name
        id: compute
        run: |
          echo "repo_name_lower_case=$(echo ${GITHUB_REPOSITORY@L} | cut -d'/' -f2)" >> $GITHUB_OUTPUT
          echo "build_matrix=$(cat .github/platforms.yml | yq -o j --indent 0)" >> $GITHUB_OUTPUT

  Build:
    needs: Setup
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.Setup.outputs.build_matrix) }}
    runs-on: ${{ matrix.runner }}
    env:
      DOCKER_USER: ${{ vars.DOCKER_HUB_USERNAME || github.repository_owner }}
      IMAGE_NAME: ${{ vars.IMAGE_NAME || needs.Setup.outputs.repo_name_lower_case }}
      VERSION: ${{ needs.Setup.outputs.version }}
      MISE_VERSION: ${{ needs.Setup.outputs.mise }}
      UV_VERSION: ${{ needs.Setup.outputs.uv }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        if: github.event_name == 'release'
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKER_HUB_USERNAME || github.repository_owner }}
          password: ${{ secrets.DOCKER_HUB_DEPLOY_KEY }}

      - name: Build images
        env:
          ACTION: ${{ github.event_name == 'release' && '--push' || '--load' }}
          CACHE_SCOPE: build-${{ matrix.arch }}
        run: |
          for target in base did; do
            repo="${DOCKER_USER}/${IMAGE_NAME}"
            [ "$target" = "did" ] && repo="${repo}-did"
            tag="${repo}:${VERSION}-mise-${MISE_VERSION}-uv-${UV_VERSION}-${{ matrix.arch }}"
            echo "Building ${target} ($GITHUB_EVENT_NAME): ${tag}"
            docker buildx build \
              --platform "${{ matrix.platform }}" \
              --build-arg MISE_VERSION="${MISE_VERSION}" \
              --build-arg UV_VERSION="${UV_VERSION}" \
              --target "${target}" \
              --cache-from "type=gha,scope=${CACHE_SCOPE}" \
              --cache-to "type=gha,mode=max,scope=${CACHE_SCOPE}" \
              $ACTION \
              --tag "${tag}" \
              -f Dockerfile .
          done
  Manifest:
    if: github.event_name == 'release'
    needs:
      - Setup
      - Build
    runs-on: ubuntu-24.04
    env:
      DOCKER_USER: ${{ vars.DOCKER_HUB_USERNAME || github.repository_owner }}
      IMAGE_NAME: ${{ vars.IMAGE_NAME || needs.Setup.outputs.repo_name_lower_case }}
      VERSION: ${{ needs.Setup.outputs.version }}
      MISE_VERSION: ${{ needs.Setup.outputs.mise }}
      UV_VERSION: ${{ needs.Setup.outputs.uv }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKER_HUB_USERNAME || github.repository_owner }}
          password: ${{ secrets.DOCKER_HUB_DEPLOY_KEY }}

      - name: Create and push multi-arch manifest for mise
        run: |
          echo "Combining ${DOCKER_USER}/${IMAGE_NAME}:${VERSION}-mise-${MISE_VERSION}-uv-${UV_VERSION}-{amd64,arm64}"
          docker buildx imagetools create \
            --tag "${DOCKER_USER}/${IMAGE_NAME}:${VERSION}" \
            --tag "${DOCKER_USER}/${IMAGE_NAME}:${VERSION}-mise-${MISE_VERSION}-uv-${UV_VERSION}" \
            --tag "${DOCKER_USER}/${IMAGE_NAME}:latest" \
            $(for i in $(yq '.[].arch' .github/platforms.yml); do echo "${DOCKER_USER}/${IMAGE_NAME}:${VERSION}-mise-${MISE_VERSION}-uv-${UV_VERSION}-$i"; done)

      - name: Inspect published manifest for mise
        run: docker buildx imagetools inspect "${DOCKER_USER}/${IMAGE_NAME}:${VERSION}"

      - name: Create and push multi-arch manifest for mise-did
        run: |
          echo "Combining ${DOCKER_USER}/${IMAGE_NAME}-did:${VERSION}-mise-${MISE_VERSION}-uv-${UV_VERSION}-{amd64,arm64}"
          docker buildx imagetools create \
            --tag "${DOCKER_USER}/${IMAGE_NAME}-did:${VERSION}" \
            --tag "${DOCKER_USER}/${IMAGE_NAME}-did:${VERSION}-mise-${MISE_VERSION}-uv-${UV_VERSION}" \
            --tag "${DOCKER_USER}/${IMAGE_NAME}-did:latest" \
            $(for i in $(yq '.[].arch' .github/platforms.yml); do echo "${DOCKER_USER}/${IMAGE_NAME}-did:${VERSION}-mise-${MISE_VERSION}-uv-${UV_VERSION}-$i"; done)

      - name: Inspect published manifest for mise-did
        run: docker buildx imagetools inspect "${DOCKER_USER}/${IMAGE_NAME}-did:${VERSION}"

  Check-Build:
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    needs:
      - Build
      - Manifest
    steps:
      - run: |
          result="${{ needs.Build.result }}"
          if [[ $result == "success" || $result == "skipped" ]]; then
            exit 0
          else
            exit 1
          fi
