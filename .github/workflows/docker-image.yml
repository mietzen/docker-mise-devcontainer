name: Build Docker Image

on:
  pull_request:
  release:
    types: [published]

jobs:
  Setup:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.versions.outputs.version }}
      mise: ${{ steps.versions.outputs.mise }}
      uv: ${{ steps.versions.outputs.uv }}
      repo_name_lower_case: ${{ steps.compute.outputs.repo_name_lower_case }}
      build_matrix: ${{ steps.compute.outputs.build_matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Load versions
        id: versions
        run: |
          echo "version=$(cat VERSION)" >> $GITHUB_OUTPUT
          echo "mise=$(cat MISE_VERSION)" >> $GITHUB_OUTPUT
          echo "uv=$(cat UV_VERSION)" >> $GITHUB_OUTPUT
      - name: Compute matrix + image name
        id: compute
        run: |
          echo "repo_name_lower_case=$(echo ${GITHUB_REPOSITORY@L} | cut -d'/' -f2)" >> $GITHUB_OUTPUT
          echo "build_matrix=$(cat .github/platforms.json | jq -c '.platforms | map(
            if . == "linux/amd64" then {platform: ., runner: "ubuntu-latest", arch: "amd64"}
            elif . == "linux/arm64" then {platform: ., runner: "ubuntu-24.04-arm", arch: "arm64"}
            else {platform: ., runner: "ubuntu-latest", arch: ""} end
          )')" >> $GITHUB_OUTPUT

  Build:
    needs: Setup
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.Setup.outputs.build_matrix) }}
    runs-on: ${{ matrix.runner }}
    env:
      DOCKER_USER: ${{ vars.DOCKER_HUB_USERNAME || github.repository_owner }}
      IMAGE_NAME: ${{ vars.IMAGE_NAME || needs.Setup.outputs.repo_name_lower_case }}
      VERSION: ${{ needs.Setup.outputs.version }}
      MISE_VERSION: ${{ needs.Setup.outputs.mise }}
      UV_VERSION: ${{ needs.Setup.outputs.uv }}
      BUILD: ${{ github.run_number }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        if: github.event_name == 'release'
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKER_HUB_USERNAME || github.repository_owner }}
          password: ${{ secrets.DOCKER_HUB_DEPLOY_KEY }}

      - name: Build and load (pull requests)
        if: github.event_name != 'release'
        run: |
          echo "Building: ${IMAGE_NAME}  platform: ${{ matrix.platform }}  (native ${{ matrix.arch }})"
          docker buildx build \
            --platform "${{ matrix.platform }}" \
            --build-arg MISE_VERSION="${MISE_VERSION}" \
            --build-arg UV_VERSION="${UV_VERSION}" \
            --load \
            -f Dockerfile .

      - name: Build and push native arch image (release)
        if: github.event_name == 'release'
        run: |
          echo "Building native ${{ matrix.arch }}: ${DOCKER_USER}/${IMAGE_NAME}:${VERSION}-${BUILD}-${{ matrix.arch }}"
          docker buildx build \
            --platform "${{ matrix.platform }}" \
            --build-arg MISE_VERSION="${MISE_VERSION}" \
            --build-arg UV_VERSION="${UV_VERSION}" \
            --push \
            --tag "${DOCKER_USER}/${IMAGE_NAME}:${VERSION}-${BUILD}-${{ matrix.arch }}" \
            -f Dockerfile .

  Manifest:
    if: github.event_name == 'release'
    needs:
      - Setup
      - Build
    runs-on: ubuntu-latest
    env:
      DOCKER_USER: ${{ vars.DOCKER_HUB_USERNAME || github.repository_owner }}
      IMAGE_NAME: ${{ vars.IMAGE_NAME || needs.Setup.outputs.repo_name_lower_case }}
      VERSION: ${{ needs.Setup.outputs.version }}
      MISE_VERSION: ${{ needs.Setup.outputs.mise }}
      UV_VERSION: ${{ needs.Setup.outputs.uv }}
      BUILD: ${{ github.run_number }}
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKER_HUB_USERNAME || github.repository_owner }}
          password: ${{ secrets.DOCKER_HUB_DEPLOY_KEY }}

      - name: Create and push multi-arch manifest
        run: |
          echo "Combining ${DOCKER_USER}/${IMAGE_NAME}:${VERSION}-${BUILD}-{amd64,arm64}"
          docker buildx imagetools create \
            --tag "${DOCKER_USER}/${IMAGE_NAME}:${VERSION}" \
            --tag "${DOCKER_USER}/${IMAGE_NAME}:${VERSION}-mise-${MISE_VERSION}-uv-${UV_VERSION}" \
            --tag "${DOCKER_USER}/${IMAGE_NAME}:latest" \
            "${DOCKER_USER}/${IMAGE_NAME}:${VERSION}-${BUILD}-amd64" \
            "${DOCKER_USER}/${IMAGE_NAME}:${VERSION}-${BUILD}-arm64"

      - name: Inspect published manifest
        run: docker buildx imagetools inspect "${DOCKER_USER}/${IMAGE_NAME}:${VERSION}"