name: Build Docker Image

on:
  pull_request:
  release:
    types: [published]

jobs:
  Setup:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.versions.outputs.version }}
      mise: ${{ steps.versions.outputs.mise }}
      uv: ${{ steps.versions.outputs.uv }}
      repo_name_lower_case: ${{ steps.compute.outputs.repo_name_lower_case }}
      build_matrix: ${{ steps.compute.outputs.build_matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Load versions
        id: versions
        run: |
          TAG="${{ github.event.release.tag_name || 'main' }}"
          echo "version=${TAG#v}" >> $GITHUB_OUTPUT
          echo "mise=$(cat MISE_VERSION)" >> $GITHUB_OUTPUT
          echo "uv=$(cat UV_VERSION)" >> $GITHUB_OUTPUT
      - name: Compute matrix + image name
        id: compute
        run: |
          echo "repo_name_lower_case=$(echo ${GITHUB_REPOSITORY@L} | cut -d'/' -f2)" >> $GITHUB_OUTPUT
          echo "build_matrix=$(cat .github/platforms.yml | yq -o j --indent 0)" >> $GITHUB_OUTPUT

  Build:
    needs: Setup
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.Setup.outputs.build_matrix) }}
    runs-on: ${{ matrix.runner }}
    env:
      DOCKER_USER: ${{ vars.DOCKER_HUB_USERNAME || github.repository_owner }}
      IMAGE_NAME: ${{ vars.IMAGE_NAME || needs.Setup.outputs.repo_name_lower_case }}
      VERSION: ${{ needs.Setup.outputs.version }}
      MISE_VERSION: ${{ needs.Setup.outputs.mise }}
      UV_VERSION: ${{ needs.Setup.outputs.uv }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        if: github.event_name == 'release'
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKER_HUB_USERNAME || github.repository_owner }}
          password: ${{ secrets.DOCKER_HUB_DEPLOY_KEY }}

      - name: Build native arch image
        env:
          ACTION: ${{ github.event_name == 'release' && '--push' || '--load' }}
        run: |
          echo "Building native ${{ matrix.arch }} ($GITHUB_EVENT_NAME):"
          echo "${DOCKER_USER}/${IMAGE_NAME}:${VERSION}-mise-${MISE_VERSION}-uv-${UV_VERSION}-${{ matrix.arch }}"
          docker buildx build \
            --platform "${{ matrix.platform }}" \
            --build-arg MISE_VERSION="${MISE_VERSION}" \
            --build-arg UV_VERSION="${UV_VERSION}" \
            $ACTION \
            --tag "${DOCKER_USER}/${IMAGE_NAME}:${VERSION}-mise-${MISE_VERSION}-uv-${UV_VERSION}-${{ matrix.arch }}" \
            -f Dockerfile .

  Manifest:
    if: github.event_name == 'release'
    needs:
      - Setup
      - Build
    runs-on: ubuntu-24.04
    env:
      DOCKER_USER: ${{ vars.DOCKER_HUB_USERNAME || github.repository_owner }}
      IMAGE_NAME: ${{ vars.IMAGE_NAME || needs.Setup.outputs.repo_name_lower_case }}
      VERSION: ${{ needs.Setup.outputs.version }}
      MISE_VERSION: ${{ needs.Setup.outputs.mise }}
      UV_VERSION: ${{ needs.Setup.outputs.uv }}
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKER_HUB_USERNAME || github.repository_owner }}
          password: ${{ secrets.DOCKER_HUB_DEPLOY_KEY }}

      - name: Create and push multi-arch manifest
        run: |
          echo "Combining ${DOCKER_USER}/${IMAGE_NAME}:${VERSION}-mise-${MISE_VERSION}-uv-${UV_VERSION}-{amd64,arm64}"
          docker buildx imagetools create \
            --tag "${DOCKER_USER}/${IMAGE_NAME}:${VERSION}" \
            --tag "${DOCKER_USER}/${IMAGE_NAME}:${VERSION}-mise-${MISE_VERSION}-uv-${UV_VERSION}" \
            --tag "${DOCKER_USER}/${IMAGE_NAME}:latest" \
            "${DOCKER_USER}/${IMAGE_NAME}:${VERSION}-mise-${MISE_VERSION}-uv-${UV_VERSION}-amd64" \
            "${DOCKER_USER}/${IMAGE_NAME}:${VERSION}-mise-${MISE_VERSION}-uv-${UV_VERSION}-arm64"

      - name: Inspect published manifest
        run: docker buildx imagetools inspect "${DOCKER_USER}/${IMAGE_NAME}:${VERSION}"

  Check-Build:
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    needs:
      - Build
      - Manifest
    steps:
      - run: |
          result="${{ needs.Build.result }}"
          if [[ $result == "success" || $result == "skipped" ]]; then
            exit 0
          else
            exit 1
          fi