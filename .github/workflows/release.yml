name: Release Docker Image

on:
  pull_request:
    types: [closed]

permissions:
  contents: write

jobs:
  release:
    name: "Bump version and create release"
    runs-on: ubuntu-latest
    if: |
      github.event.pull_request.merged == true &&
      (github.event.pull_request.user.login == 'dependabot[bot]' ||
       contains(github.event.pull_request.labels.*.name, 'auto-update'))
    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Generate token
      uses: actions/create-github-app-token@v3
      id: generate-token
      with:
        client-id: ${{ secrets.APP_ID }}
        private-key: ${{ secrets.APP_PRIVATE_KEY }}

    - name: Read versions and bump VERSION
      id: versions
      run: |
        MISE_VERSION=$(cat MISE_VERSION)
        UV_VERSION=$(cat UV_VERSION)
        OLD_VERSION=$(cat VERSION)
        NEW_VERSION=$(echo "${OLD_VERSION}" | awk -F. '{$NF = $NF + 1; print $1"."$2"."$NF}')
        echo "${NEW_VERSION}" > VERSION
        echo "mise_version=${MISE_VERSION}" >> $GITHUB_OUTPUT
        echo "uv_version=${UV_VERSION}" >> $GITHUB_OUTPUT
        echo "new_version=${NEW_VERSION}" >> $GITHUB_OUTPUT

    - name: Get GitHub App User ID
      id: get-user-id
      env:
        GH_TOKEN: ${{ steps.generate-token.outputs.token }}
      run: echo "user-id=$(gh api "/users/${{ steps.generate-token.outputs.app-slug }}[bot]" --jq .id)" >> "$GITHUB_OUTPUT"

    - name: Commit version bump
      env:
        GH_TOKEN: ${{ steps.generate-token.outputs.token }}
      run: |
        git config --global user.name '${{ steps.generate-token.outputs.app-slug }}[bot]'
        git config --global user.email '${{ steps.get-user-id.outputs.user-id }}+${{ steps.generate-token.outputs.app-slug }}[bot]@users.noreply.github.com'
        git add VERSION
        git commit -m "Bump VERSION to ${{ steps.versions.outputs.new_version }}"
        git push

    - name: Create GitHub Release
      env:
        GH_TOKEN: ${{ steps.generate-token.outputs.token }}
      run: |
        gh release create "${{ steps.versions.outputs.new_version }}" --generate-notes \
          --title "v${{ steps.versions.outputs.new_version }} (mise ${{ steps.versions.outputs.mise_version }}, uv ${{ steps.versions.outputs.uv_version }})"