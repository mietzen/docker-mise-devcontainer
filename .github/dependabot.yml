version: 2
updates:
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "daily"
      time: "22:00"
      timezone: "Europe/Berlin"
  - package-ecosystem: "github-actions"
    directory: "/.github/workflows"
    schedule:
      interval: "weekly"
      time: "10:00"
      day: "saturday"
      timezone: "Europe/Berlin"
